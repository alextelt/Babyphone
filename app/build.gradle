plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.alexis.babyphone'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.alexis.babyphone'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Clé de signature fixe : permet d'installer les nouvelles versions
    // par-dessus l'ancienne sans désinstaller.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
